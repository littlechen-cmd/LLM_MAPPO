# G3 draft: G2-3 selected the matched early-charge configuration.
environment:
  id: llm-mappo-medium-3ag-v1
  n_agents: 5
  max_steps: 1000
  battery_cost_scale: 1.1
  charge_threshold: 0.30
  charge_release_threshold: 0.8
  waypoint_reward: 0.01
  oracle_interaction_mask: true
  deadlock_steps: 180
  batch_interval: 40
  batch_size_range: [4, 8]
  initial_priority_label: A
  priority_schedule: null
  request_queue_size: 8
  task_completion_target: 50

training:
  phase: "4"
  seed: 7
  training_seed_groups: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109]
  use_astar_kl_teacher: false
  use_offline_llm_teacher: false
  device: auto
  torch_num_threads: 1
  cuda_allow_tf32: true
  parallel_envs: 12
  episodes: 1000
  environment_step_budget: 150000
  rollout_steps: 512
  checkpoint_interval: 100
  metrics_write_interval: 20
  output_dir: artifacts/g4_core_mappo_wp
  offline_semantic_dataset: artifacts/phase4_labels/deepseek_medium_5ag_400_v2_repaired_r2.jsonl
  offline_semantic_neighbours: 3

ppo:
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_coefficient: 0.5
  entropy_coefficient: 0.01
  learning_rate: 0.0003
  max_grad_norm: 0.5
  update_epochs: 4
  minibatch_steps: 64
  engagement_coefficient: 0.0
  engagement_decay_interval: 1000
  engagement_decay_factor: 0.90
  engagement_minimum: 0.0
  reservation_kl_coefficient: 0.0
  reservation_kl_decay_interval: 2000
  reservation_kl_decay_factor: 0.90
  reservation_kl_minimum: 0.0

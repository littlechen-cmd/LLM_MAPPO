schema: r1-mappo-fp-dg-v1
method: MAPPO-FP-DG
artifact_root: artifacts/optimization/r1_convergence/mappo_fp_dg_3ag_lowload
environment:
  environment_id: llm-mappo-medium-3ag-v1
  n_agents: 3
  max_steps: 1000
  dynamic_ingress_interval: 40
  batch_size_range: [1, 3]
  queue_size: 4
  task_target: 9
  initial_priority_label: A
  battery_cost_scale: 1.10
  charge_threshold: 0.30
  charge_release_threshold: 0.80
  deadlock_steps: 180
  observation_schema: direct-goal-observation-v1
  goal_progress_reward: 0.10
  reward_version: legacy-v1
  oracle_interaction_mask: true
training:
  seed: 9107
  environment_steps: 500000
  num_env_workers: 16
  rollout_length: 64
  ppo_epochs: 5
  num_minibatches: 1
  gamma: 0.99
  gae_lambda: 0.95
  clip_param: 0.20
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.0003
  entropy_coefficient: 0.01
  value_loss_coefficient: 0.50
  max_gradient_norm: 0.50
  huber_delta: 10.0
  hidden_dimension: 128
  checkpoint_interval_steps: 25000
evaluation:
  seeds: [9400, 9401, 9402, 9403, 9404, 9405, 9406, 9407, 9408, 9409]
  deterministic_policy: argmax
  replay_frame_stride: 2
  replay_frame_duration_ms: 300

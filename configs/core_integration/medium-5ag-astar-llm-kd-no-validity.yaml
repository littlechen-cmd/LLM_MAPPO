schema: core-mappo-209d-delivery-v2
method: MAPPO-FP-ASTARKD-NO-VALIDITY-LLM-INIT
approval_status: provisional
artifact_root: artifacts/core_integration/astar_llm_kd
environment: &medium5_environment

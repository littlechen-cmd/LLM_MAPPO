environment:
  id: llm-mappo-medium-3ag-v1
  n_agents: 3
  max_steps: 1000
  battery_cost_scale: 1.1
  charge_threshold: 0.3
  charge_release_threshold: 0.8
  waypoint_reward: 0.01
  include_waypoint_features: true
  oracle_interaction_mask: true
  deadlock_steps: 180
  batch_interval: 40
  batch_size_range: [1, 3]
  initial_priority_label: A
  priority_schedule: null
  request_queue_size: 4
  task_completion_target: 9
training:
  phase: '4'
  seed: 7
  training_seed_groups: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109]
  device: cuda
  torch_num_threads: 1
  cuda_allow_tf32: true
  parallel_envs: 12
  environment_step_budget: 150000
  episodes: 2000
  rollout_steps: 512
  checkpoint_interval: 200
  metrics_write_interval: 20
  output_dir: artifacts/stable/formal_training/rule_kd
  offline_semantic_neighbours: 3
  offline_semantic_dataset: artifacts/stable/labels/rule_kd_3ag_v1.jsonl

ppo:
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_coefficient: 0.5
  entropy_coefficient: 0.01
  learning_rate: 0.0003
  max_grad_norm: 0.5
  update_epochs: 4
  minibatch_steps: 64
  engagement_coefficient: 0.10
  engagement_decay_interval: 1000
  engagement_decay_factor: 0.90
  engagement_minimum: 0.0
  reservation_kl_coefficient: 0.05
  reservation_kl_decay_interval: 2000
  reservation_kl_decay_factor: 0.90
  reservation_kl_minimum: 0.0

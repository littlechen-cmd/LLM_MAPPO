    charge_release_threshold: 0.8

failure_policy:
  infrastructure_error: rerun_same_seed_and_unchanged_config_with_record
  algorithm_numerical_or_safety_failure: retain_and_report_as_outcome
  missing_or_corrupt_seed: comparison_no_go_unless_same_seed_evidence_is_rebuilt
  teacher_invalid: zero_kd_weight_fail_closed
  prohibited_fallbacks: [Fixed-KD, uniform, old_2D, NOOP_teacher, cached_old_label, shorter_horizon]

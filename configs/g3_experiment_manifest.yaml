schema_version: 4
status: o0_g_final_owner_approval_pending
document_role: governance_manifest_not_runtime_training_config
canonical_architecture: docs/architecture/o0-reward-calibrated-heterogeneous-distillation.md
freeze_blockers:
  - O0-G zero-deviation owner approval
  - O1 implementation and static validation
  - O2 owner-run calibration Go
  - O3 unseen-topology freeze
  - D1 single-route decision
  - E1 selected-route protocol freeze

code:
  branch: codex/o0-astar-teacher-redesign
  p0_base_commit: 6fcb7d3
  frozen_implementation_commit: null

python_environment:
  interpreter: 'D:\Anaconda3\envs\py310\python.exe'
  direct_invocation_required: true
  conda_activate_required: false
  environment_creation_or_modification: prohibited

route_profiles:
  optimization:
    branch: codex/optimization
    artifact_root: artifacts/optimization
    prerequisites: [O0, O1, O2, O3]
    observation_schema: direct-goal-observation-v1
    execution_planner_queries_required: 0
    formal_training_seeds: [7, 17, 27, 37, 47, 57, 67, 77]
    diagnostic_training_seeds: [7, 17, 27]
    o2_training_seeds: [107, 117, 127]
    energy:
      battery_cost_scale: 1.1
      charge_threshold: 0.30
      charge_release_threshold: 0.8
    unseen_topologies: pending_o3_design_from_scratch
    same_map_eight_agv_stress: prohibited
  stable:
    branch: codex/stable
    artifact_root: artifacts/stable
    predecision_artifact_root: artifacts/stable/predecision
    prerequisite: S1
    environment:
      n_agents: 3
      task_completion_target: 9
      dynamic_ingress: true
    energy:
      battery_cost_scale: 1.1
      charge_threshold: 0.30
      charge_release_threshold: 0.8
    formal_training_seeds: [7, 17, 27, 37, 47]
    diagnostic_training_seeds: [7, 17, 27]
    runtime_waypoint_dependency: retained_legacy_phase3
    unseen_topologies: prohibited
    same_map_eight_agv_stress: prohibited

astar_teacher_contract:
  optimization:
    version: pure-motion-teacher-v1
    role: training_only_root_action_conditioned_motion_prior
    k_motion: 12
    expansion_budget_per_agent_query: 512
    action_support: [FORWARD, LEFT, RIGHT]
    pure_motion_mask_required: true
    reward_calibration_cannot_change_label_or_validity: true
    runtime_student_planner_queries: 0
  stable:
    status: pending_s1_historical_behavior_restoration
    runtime_waypoint_dependency: retained
  heuristic_baseline_action_source: AStarExpert.act

offline_llm_dataset:
  optimization:
    semantic_view: semantic-view-v3
    prompt_version: semantic-prompt-v4-directional-rubric
    labels: [task_persistence, yielding_preference, coordination_risk]
    score_range: continuous_[0,1]
    pilot_records: 60
    formal_records: 800
    pilot_enters_training: false
    preferred_model: deepseek-v4-flash
    conditional_fallback_model: deepseek-v4-pro
    online_calls_during_training_and_evaluation: 0
    formal_path: null
    formal_sha256: null
  stable:
    path: artifacts/phase4_labels/deepseek_medium_5ag_400_v2_repaired_r2.jsonl
    records: 400
    sha256: 9928f5756c1261589946eb3aedf8dc2c1fa6f73f037cd05c31afca0683161797
    labels: [task_commitment, local_assertiveness]
    online_calls_during_training_and_evaluation: 0

optimization_learning_groups:
  MAPPO-DG:
    role: no_teacher_baseline
    astar_kd: false
    llm_kd: false
    reward_calibration: false
  RC-AStarKD:
    role: pure_motion_teacher_only
    astar_kd: reward_calibrated
    llm_kd: false
  Fixed-AStarKD:
    role: o2_fixed_pure_motion_control_only
    astar_kd: fixed
    llm_kd: false
  LLMKD:
    role: three_dimensional_semantic_teacher_only
    astar_kd: false
    llm_kd: semantic_v3
  RC-AStarKD+LLMKD:
    role: full_method
    astar_kd: reward_calibrated
    llm_kd: semantic_v3
  Fixed-AStarKD+LLMKD:
    role: reward_calibration_control
    astar_kd: fixed
    llm_kd: semantic_v3
  QMIX-DG:
    role: external_marl_baseline
    observation_schema: direct-goal-observation-v1
  RuleKD-v3:
    role: deterministic_semantic_teacher_baseline
    rules_reference: canonical_architecture_section_13_3
    cannot_generate_or_modify_llm_labels: true
  ShuffleKD-v3:
    role: diagnostic_state_label_correspondence_control
    training_seeds: [7, 17, 27]
    stratified_joint_label_derangement: true
    fixed_points: prohibited
    confirmatory: false
  NoOOD-v1:
    role: diagnostic_ood_reliability_control
    training_seeds: [7, 17, 27]
    valid_record_ood_weight: 1.0
    confirmatory: false
  NoGoalHint-v1:
    role: diagnostic_goal_geometry_sensitivity
    observation_schema: no-geometric-goal-hint-v1
    training_seeds: [7, 17, 27]
    execution_planner_queries_required: 0
    cannot_support_execution_astar_dependency_claim: true
    confirmatory: false
  Heuristic-Dispatcher+AStar:
    role: nonlearning_planning_baseline
    training_seeds: []
    action_source: AStarExpert

comparison_fairness:
  shared_environment_contract: true
  shared_action_masks_and_rule_safety: true
  shared_reward_and_energy_configuration: true
  shared_environment_step_budget_rule: true
  matched_training_and_evaluation_seeds: true
  final_checkpoint_only: true
  group_specific_tuning_after_results: prohibited
  qmix_directgoal_observation_required: true
  qmix_fallback: prohibited

training:
  policy_initialization_seeds: [7, 17, 27, 37, 47, 57, 67, 77]
  diagnostic_policy_initialization_seeds: [7, 17, 27]
  o2_policy_initialization_seeds: [107, 117, 127]
  o2_environment_steps: 150000
  o2_auc_grid_environment_steps:
    start: 0
    stop: 150000
    interval: 10000
  formal_environment_steps: null
  formal_budget_rule: one_value_frozen_at_E1_and_shared_by_all_learning_groups
  checkpoint_rule: checkpoint_final.pt
  optimization_run_budget:
    o2_calibration: 9
    e1_e2_core_2x2: 32
    e1_e2_fixed_kd: 8
    e1_e2_qmix_dg: 8
    e1_e2_rule_kd: 8
    e1_e2_three_diagnostics: 9
    e1_e2_total: 65
    total_including_o2: 74

o2_gate:
  groups: [MAPPO-DG, Fixed-AStarKD, RC-AStarKD]
  llm_kd_in_o2_groups: false
  coverage_denominator: all_agent_slots_in_calibration_selected_real_states
  astar_valid_coverage_each_rc_seed_min: 0.25
  fixed_rc_selected_query_and_shadow_counts_must_match: true
  auc_y: cumulative_completed_tasks_per_1000_cumulative_episode_steps
  auc_x: real_environment_steps_divided_by_150000
  auc_aggregation: per_training_seed_then_median_relative_degradation
  rc_vs_mappo_dg_median_auc_degradation_max: 0.10

evaluation:
  deterministic_actions: true
  held_out_seeds: [200, 201, 202, 203, 204, 205, 206, 207, 208, 209]
  episodes_per_seed: 20
  aggregation_unit: training_initialization_seed
  paired_across_learning_groups: true
  checkpoint: checkpoint_final.pt
  same_map_eight_agv_stress: prohibited

training_logs:
  run_manifest: run_manifest.json
  compact_step_counts: teacher_step_counts.csv
  sampled_or_exception_events: teacher_events.jsonl
  updates: updates.csv
  episodes: episodes.csv
  resource_windows: resource_windows.csv
  ordinary_state_full_array_jsonl: prohibited
  event_audit_sampler: sha256_mod_256_v1
  fixed_rc_logging_density_identical: true
  primary_sample_efficiency_metric: completed_tasks_per_1000_steps_auc

analysis:
  primary_utility_metric: completed_tasks_per_1000_steps
  primary_sample_efficiency_metric: completed_tasks_per_1000_steps_auc
  secondary_metrics:
    - team_reward
    - completion_rate
    - collisions
    - terminal_deadlocks
    - energy_deaths
    - charging_exposure
    - priority_task_completion
  # Five registered comparison categories contain seven flattened primary contrasts.
  confirmatory_comparisons:
    - category: core_factorial
      contrasts: [astar_kd_main_effect, llm_kd_main_effect, astar_x_llm_interaction]
    - category: full_vs_baseline
      contrasts: [full_rc_vs_mappo_dg]
    - category: reward_calibration
      contrasts: [full_rc_vs_fixed_kd]
    - category: external_marl
      contrasts: [full_rc_vs_qmix_dg]
    - category: semantic_teacher_source
      contrasts: [full_rc_vs_rule_kd_v3]
  flattened_confirmatory_contrast_count: 7
  primary_test: two_sided_paired_t_test
  multiple_testing: Holm_across_seven_primary_contrasts
  confidence_interval: 95_percent_t_interval
  effect_size: paired_dz
  bootstrap_sensitivity:
    resamples: 10000
    seed: 20260825
    interval: percentile_95_percent
  diagnostic_groups_do_not_support_significance_claims: true
  episode_pseudoreplication: prohibited

label_audit:
  held_out_state_count: 100
  sampling_seed: 20260820
  scenario_quota:
    normal_transport: 20
    priority_conflict: 20
    narrow_corridor_yield: 20
    low_battery_diversion: 20
    station_exit_congestion: 20
  independent_raters: 2
  labels: [task_persistence, yielding_preference, coordination_risk]
  scoring_increment: 0.1
  protocol: plan/label-audit-protocol.md

energy:
  stable_frozen:
    battery_cost_scale: 1.1
    charge_threshold: 0.30
    charge_release_threshold: 0.8
  optimization:
    status: retained_g2_3_core_contract
    battery_cost_scale: 1.1
    charge_threshold: 0.30
    charge_release_threshold: 0.8

failure_policy:
  infrastructure_error: rerun_same_seed_and_unchanged_config_with_record
  algorithm_numerical_or_safety_failure: retain_and_report_as_outcome
  missing_or_corrupt_seed: comparison_no_go_unless_same_seed_evidence_is_rebuilt
  teacher_invalid: zero_kd_weight_fail_closed
  prohibited_fallbacks: [Fixed-KD, uniform, old_2D, NOOP_teacher, cached_old_label, shorter_horizon]

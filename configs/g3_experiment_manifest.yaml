training_logs:
  run_manifest: run_manifest.json
  compact_step_counts: teacher_step_counts.csv
  sampled_or_exception_events: teacher_events.jsonl
  updates: updates.csv
  episodes: episodes.csv
  resource_windows: resource_windows.csv
  ordinary_state_full_array_jsonl: prohibited
  event_audit_sampler: sha256_mod_256_v1
  fixed_rc_logging_density_identical: true
  primary_sample_efficiency_metric: completed_tasks_per_1000_steps_auc

analysis:
  primary_utility_metric: completed_tasks_per_1000_steps
  primary_sample_efficiency_metric: completed_tasks_per_1000_steps_auc
  secondary_metrics:
    - team_reward
    - completion_rate
    - collisions
    - terminal_deadlocks
    - energy_deaths
    - charging_exposure
    - priority_task_completion
  # Five registered comparison categories contain seven flattened primary contrasts.
  confirmatory_comparisons:
    - category: core_factorial
      contrasts: [astar_kd_main_effect, llm_kd_main_effect, astar_x_llm_interaction]
    - category: full_vs_baseline
      contrasts: [full_rc_vs_mappo_dg]
    - category: reward_calibration
      contrasts: [full_rc_vs_fixed_kd]
    - category: external_marl
      contrasts: [full_rc_vs_qmix_dg]
    - category: semantic_teacher_source
      contrasts: [full_rc_vs_rule_kd_v3]
  flattened_confirmatory_contrast_count: 7
  primary_test: two_sided_paired_t_test
  multiple_testing: Holm_across_seven_primary_contrasts
  confidence_interval: 95_percent_t_interval
  effect_size: paired_dz
  bootstrap_sensitivity:
    resamples: 10000
    seed: 20260825
    interval: percentile_95_percent
  diagnostic_groups_do_not_support_significance_claims: true
  episode_pseudoreplication: prohibited

label_audit:
  held_out_state_count: 100
  sampling_seed: 20260820
  scenario_quota:
    normal_transport: 20
    priority_conflict: 20
    narrow_corridor_yield: 20
    low_battery_diversion: 20
    station_exit_congestion: 20
  independent_raters: 2
  labels: [task_persistence, yielding_preference, coordination_risk]
  scoring_increment: 0.1
  protocol: plan/label-audit-protocol.md

energy:
  stable_frozen:
    battery_cost_scale: 1.1
    charge_threshold: 0.30
    charge_release_threshold: 0.8
  optimization:
